<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6a3ef3" />
    <meta name="description" content="O'yin uslubidagi rangli kalkulyator." />
    <title>Game Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <main class="app-shell">
      <div class="game-card">
        <div class="top-bar">
          <div class="brand">
            <span class="brand-mark">✦</span>
            <span>GAME CALC</span>
          </div>
          <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Sound on/off" aria-pressed="true">
            <span class="sound-icon">♪</span>
            <span class="sound-text">ON</span>
          </button>
        </div>

        <div class="screen-wrap">
          <div class="expression" id="expression">&nbsp;</div>
          <div class="result" id="result">0</div>
        </div>

        <div class="keys" id="keys" aria-label="Calculator keypad">
          <button class="btn control" data-action="clear">AC</button>
          <button class="btn control" data-action="delete">DEL</button>
          <button class="btn operator" data-op="%">%</button>
          <button class="btn operator" data-op="÷">÷</button>

          <button class="btn" data-number="7">7</button>
          <button class="btn" data-number="8">8</button>
          <button class="btn" data-number="9">9</button>
          <button class="btn operator" data-op="×">×</button>

          <button class="btn" data-number="4">4</button>
          <button class="btn" data-number="5">5</button>
          <button class="btn" data-number="6">6</button>
          <button class="btn operator" data-op="−">−</button>

          <button class="btn" data-number="1">1</button>
          <button class="btn" data-number="2">2</button>
          <button class="btn" data-number="3">3</button>
          <button class="btn operator" data-op="+">+</button>

          <button class="btn sign" data-action="sign">±</button>
          <button class="btn" data-number="0">0</button>
          <button class="btn decimal" data-action="decimal">.</button>
          <button class="btn equals" data-action="equals">=</button>
        </div>
      </div>
    </main>
  </body>
</html>
