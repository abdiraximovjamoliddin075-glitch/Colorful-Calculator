<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Catch</title>
    <meta name="description" content="Neon Catch — tezkor rangli o'yin GitHub Pages uchun." />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="bg-glow bg-1"></div>
    <div class="bg-glow bg-2"></div>

    <main class="game-shell">
      <div class="hud">
        <div class="hud-box">
          <span class="hud-label">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="hud-box">
          <span class="hud-label">TIME</span>
          <strong id="time">30</strong>
        </div>
        <div class="hud-box">
          <span class="hud-label">BEST</span>
          <strong id="best">0</strong>
        </div>
      </div>

      <div class="top-bar">
        <div class="title-wrap">
          <span class="mini-tag">ARCADE</span>
          <h1>NEON CATCH</h1>
        </div>
        <button id="start-btn" class="start-btn" type="button">START</button>
      </div>

      <div id="game-area" class="game-area" aria-label="O'yin maydoni">
        <div id="message" class="message visible">Boshlash uchun START bosing</div>
      </div>
    </main>
  </body>
</html>
