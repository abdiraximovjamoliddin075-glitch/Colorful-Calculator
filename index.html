<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7028e4" />
    <meta name="description" content="Rangli, qulay va bepul onlayn kalkulyator." />
    <title>Rangli Kalkulyator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <div class="sparkle" aria-hidden="true">✦</div>
        <p class="eyebrow">ODDIY • TEZ • QULAY</p>
        <h1>Rangli <span>kalkulyator</span></h1>
        <p class="subtitle">Hisob-kitobingizni kayfiyat bilan qiling ✨</p>
      </header>

      <section class="calculator" aria-label="Kalkulyator">
        <div class="screen" aria-live="polite" aria-atomic="true">
          <div class="expression" id="expression">&nbsp;</div>
          <output class="result" id="result">0</output>
        </div>

        <div class="keys" id="keys">
          <button class="key key-soft" data-action="clear" aria-label="Hammasini tozalash">AC</button>
          <button class="key key-soft" data-action="delete" aria-label="Oxirgi raqamni o‘chirish">⌫</button>
          <button class="key key-op" data-op="%" aria-label="Foiz">%</button>
          <button class="key key-op" data-op="÷" aria-label="Bo‘lish">÷</button>

          <button class="key" data-number="7">7</button>
          <button class="key" data-number="8">8</button>
          <button class="key" data-number="9">9</button>
          <button class="key key-op" data-op="×" aria-label="Ko‘paytirish">×</button>

          <button class="key" data-number="4">4</button>
          <button class="key" data-number="5">5</button>
          <button class="key" data-number="6">6</button>
          <button class="key key-op" data-op="−" aria-label="Ayirish">−</button>

          <button class="key" data-number="1">1</button>
          <button class="key" data-number="2">2</button>
          <button class="key" data-number="3">3</button>
          <button class="key key-op" data-op="+" aria-label="Qo‘shish">+</button>

          <button class="key key-sign" data-action="sign" aria-label="Ishora almashtirish">±</button>
          <button class="key" data-number="0">0</button>
          <button class="key" data-action="decimal" aria-label="O‘nli kasr nuqtasi">.</button>
          <button class="key key-equals" data-action="equals" aria-label="Natijani hisoblash">=</button>
        </div>
        <p class="hint">Klaviaturadan ham foydalanishingiz mumkin</p>
      </section>
      <footer>Har bir hisob-kitob — yangi imkoniyat 🌈</footer>
    </main>
  </body>
</html>
